<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QRMenu</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
    }

    .card {
      max-width: 560px;
      width: 100%;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
      padding: 32px;
      text-align: center;
    }

    .title {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .button {
      display: inline-block;
      text-decoration: none;
      background: var(--accent);
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .button:hover {
      background: var(--accent-hover);
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title">Download our mobile app</h1>
    <p class="subtitle">Get the best experience by using the QRMenu mobile app.</p>
    <a class="button" href="https://github.com/Pingeru/qrmenu-mobile" target="_blank" rel="noopener noreferrer">
      View the app on GitHub
    </a>
    <div class="footer">Thanks for supporting QRMenu.</div>
  </main>
</body>
</html>
